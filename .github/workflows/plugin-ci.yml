name: Plugin CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Test and build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test plugin
        run: npm run test:plugin

      - name: Build plugin
        run: npm run build:plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsidisync-plugin
          path: |
            main.js
            manifest.json
          if-no-files-found: error

  docker:
    name: Test, build, smoke-test, and push native ARM64 image
    runs-on: ubuntu-24.04-arm
    needs: [plugin, rust-server]
    outputs:
      handoff: ${{ steps.image.outputs.handoff }}
    env:
      UPSTREAM_BASE_TAG: v0.15.0
      UPSTREAM_BASE_COMMIT: 96b83659d93877546d5164d7b468be51bac626be
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Install dependencies
        run: npm ci

      - name: Test plugin and server
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag

      - name: Build native ARM64 image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && label_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"
          docker buildx build --platform linux/arm64 --load --tag "$IMAGE_TAG" "${label_args[@]}" .
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_TAG")" = arm64

      - name: Smoke-test image over loopback
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: bash scripts/smoke-container.sh "$IMAGE_TAG"

      - name: Push or reuse immutable release tag and record digest
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            promotion_result=reused_existing_tag
          else
            docker push "$IMAGE_TAG"
            promotion_result=published_new_tag
          fi
          digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')"
          docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' | jq -e \
            --arg commit "$GITHUB_SHA" \
            '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $commit' >/dev/null
          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_docker_config"' EXIT
          DOCKER_CONFIG="$anonymous_docker_config" docker pull "$IMAGE@$digest"
          test "$(DOCKER_CONFIG="$anonymous_docker_config" docker image inspect --format '{{.Architecture}}' "$IMAGE@$digest")" = arm64
          printf 'digest=%s\nhandoff=%s@%s\npromotion_result=%s\n' \
            "$digest" "$IMAGE" "$digest" "$promotion_result" >> "$GITHUB_OUTPUT"

      - name: Write ARM64 build evidence
        env:
          IMAGE_HANDOFF: ${{ steps.image.outputs.handoff }}
          PROMOTION_RESULT: ${{ steps.image.outputs.promotion_result }}
        run: |
          set -euo pipefail
          {
            echo 'ObsidiSync native ARM64 image evidence'
            echo "source_tag=$GITHUB_REF_NAME"
            echo "source_commit=$GITHUB_SHA"
            echo "source_repository=https://github.com/$GITHUB_REPOSITORY"
            echo "upstream_base_tag=$UPSTREAM_BASE_TAG"
            echo "upstream_base_commit=$UPSTREAM_BASE_COMMIT"
            echo "builder_runner=$RUNNER_OS"
            echo "builder_architecture=$(uname -m)"
            echo 'test_command=npm test'
            echo 'test_result=passed'
            echo "image=$IMAGE_HANDOFF"
            echo "promotion_result=$PROMOTION_RESULT"
            echo "remote_provenance=verified (org.opencontainers.image.revision matches source_commit)"
            echo 'smoke_test=passed (loopback GET /v1/server/info with synthetic configuration)'
            echo 'anonymous_pull=passed'
          } > arm64-image-evidence.txt

      - name: Upload ARM64 build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsidisync-${{ github.ref_name }}-arm64-evidence
          path: arm64-image-evidence.txt
          if-no-files-found: error

  release:
    name: Publish plugin release assets
    runs-on: ubuntu-latest
    needs: [plugin, rust-server, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const version = process.argv[1]; if (!/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) { console.error(`Tag ${process.env.GITHUB_REF_NAME} is not a supported semver release tag`); process.exit(1); }" "$version"
          npm version "$version" --no-git-tag-version --allow-same-version
          node scripts/sync-version.mjs "$version"
          node -e "const pkg = require('./package.json'); const manifest = require('./manifest.json'); if (pkg.version !== manifest.version) { console.error(`package.json version ${pkg.version} does not match manifest version ${manifest.version}`); process.exit(1); }"

      - name: Build plugin
        run: npm run build:plugin

      - name: Package plugin release
        run: |
          assets=(main.js manifest.json)
          if [ -f styles.css ]; then
            assets+=(styles.css)
          fi
          zip -r plugin.zip "${assets[@]}"

      - name: Write release notes
        run: |
          repo_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo_lc}"
          package="$(basename "${repo_lc}")"
          {
            printf 'Obsidian plugin release %s.\n\n' "$GITHUB_REF_NAME"
            printf '### Sync server container image\n\n'
            printf 'The sync server is published to the GitHub Container Registry:\n\n'
            printf '```bash\n'
            printf 'docker pull %s\n' '${{ needs.docker.outputs.handoff }}'
            printf '```\n\n'
            printf -- '- `%s`\n' '${{ needs.docker.outputs.handoff }}'
            printf -- '- `%s:%s`\n\n' "$image" "$GITHUB_REF_NAME"
            printf 'Image page: https://github.com/%s/pkgs/container/%s\n' "$GITHUB_REPOSITORY" "$package"
          } > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(main.js manifest.json plugin.zip)
          if [ -f styles.css ]; then
            assets+=(styles.css)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
  rust-server:
    name: Format, lint, and test Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - working-directory: rust-server
        run: cargo fmt --check
      - working-directory: rust-server
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: rust-server
        run: cargo test --workspace
