name: CI

on:
  push:
    branches: [main, live, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  plugin:
    name: Obsidian Plugin Build
    runs-on: ubuntu-latest
    container:
      image: registry.tokenet.de/shared/build-environments/default:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Test plugin
        run: npm run test:plugin

      - name: Build plugin
        run: npm run build:plugin

  rust-server:
    name: Rust Server Lint & Test
    runs-on: ubuntu-latest
    container:
      image: registry.tokenet.de/shared/build-environments/default:latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --manifest-path rust-server/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path rust-server/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path rust-server/Cargo.toml

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    container:
      image: registry.tokenet.de/shared/build-environments/default:latest
    needs: [plugin, rust-server]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build:plugin

      - name: Run semantic-release
        env:
          GITEA_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
        run: npx semantic-release --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
